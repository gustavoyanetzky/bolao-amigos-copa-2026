<img alt="Amigos Futebol Clube Crest" class="w-full h-full object-contain drop-shadow-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6el0SNPGqhqZ-Xwk2dJjLIAF5dHsRIHDTdMEEgz2NkNEjpt2AMgYQOHNrkeOfZIyeRJNo7hX8WlWXFsR0Oo16bVD68GzLgz_pzooI_t2wF9U3PaliPgXw3OBa0kYedtsbIt0ke7rJMbduH9MeqLkosa1I0gnXanQhMotjFmwZgKBCCMa4Rb4V-iTfXI8JWr5wfag2RHH73CkbhA9wM33pwlszi5UyiYf9rEcOS0s5kwXvi83VihEbBK48KdHvvgwDVlCEYCg7Y1Y"/>

<h1 class="text-headline-lg font-headline-lg text-text-primary text-center">Bolão Amigos FC</h1>
<p class="text-body-md font-body-md text-text-secondary mt-1 text-center">Acesso Administrativo</p>
</div>
<div class="w-full bg-surface border border-border rounded-xl p-6 shadow-xl animate-fade-in-up" style="animation-delay: 0.1s;">
<form class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-1">
<label class="text-label-sm font-label-sm text-on-surface-variant block" for="email">Email Administrador</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-[20px]">mail</span>
<input class="w-full bg-surface-container-low border border-border text-text-primary text-body-md font-body-md rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-disabled" id="email" name="email" placeholder="admin@amigosfc.com" type="email"/>
</div>
</div>
<div class="space-y-1">
<label class="text-label-sm font-label-sm text-on-surface-variant block" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-[20px]">lock</span>
<input class="w-full bg-surface-container-low border border-border text-text-primary text-body-md font-body-md rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-disabled" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-border bg-surface-container-low text-primary-container focus:ring-primary-container focus:ring-offset-surface" type="checkbox"/>
<span class="text-label-sm font-label-sm text-text-secondary group-hover:text-text-primary transition-colors">Lembrar acesso</span>
</label>
<a class="text-label-sm font-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Recuperar senha</a>
</div>
<button class="w-full bg-primary-container text-on-primary-container text-body-lg font-body-lg py-3 rounded-lg hover:bg-inverse-primary transition-colors active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="submit">
                    Entrar
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
</div>

            }
