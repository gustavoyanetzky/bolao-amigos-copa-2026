<script>
        // Simple script to handle WO toggle logic for visual demo
        document.querySelectorAll('.wo-toggle').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const row = this.closest('.flex.items-center.justify-between.py-3');
                const inputs = row.querySelectorAll('.score-input');
                const nameContainer = row.querySelector('.flex-1.min-w-0');
                const nameText = row.querySelector('.text-data-cell');
                
                if (this.checked) {
                    inputs.forEach(input => {
                        input.disabled = true;
                        input.value = '0';
                        input.classList.add('bg-surface-variant', 'text-text-secondary');
                        input.classList.remove('bg-surface', 'text-text-primary');
                    });
                    nameContainer.classList.add('opacity-50');
                    nameText.classList.add('line-through');
                } else {
                    inputs.forEach(input => {
                        input.disabled = false;
                        input.value = '';
                        input.classList.remove('bg-surface-variant', 'text-text-secondary');
                        input.classList.add('bg-surface', 'text-text-primary');
                    });
                    nameContainer.classList.remove('opacity-50');
                    nameText.classList.remove('line-through');
                }
            });
        });
    </script>
